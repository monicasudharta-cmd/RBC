<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  @page { size: A4; margin: 0; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 210mm; height: 297mm; font-family: "Jost", sans-serif; color: #004d5d; background: #fff; }
  .page { width: 210mm; height: 297mm; display: flex; flex-direction: column; }
  .top { background: #ffedd9; padding: 12mm 14mm 9mm; text-align: center; }
  .top img { width: 78mm; display: block; margin: 0 auto 5mm; }
  .badge { display: inline-block; background: #004d5d; color: #ffedd9; font-size: 11pt; letter-spacing: 3px; font-weight: 500; padding: 1.6mm 6mm; border-radius: 99px; }
  .photo { height: 92mm; background: url(pool.jpg) center 78% / cover; }
  .main { flex: 1; display: flex; align-items: center; gap: 12mm; padding: 10mm 16mm; }
  .text { flex: 1; }
  h1 { font-family: "Cormorant Garamond", serif; font-weight: 600; font-size: 33pt; line-height: 1.05; margin-bottom: 4mm; }
  .bar { width: 16mm; height: 1.2mm; background: #ec9e4b; border-radius: 1mm; margin-bottom: 5mm; }
  ul { list-style: none; font-size: 12.5pt; line-height: 1.75; color: #1d3a42; }
  ul li::before { content: "●"; color: #7bbdaf; font-size: 8pt; margin-right: 3mm; vertical-align: middle; }
  .qrbox { width: 66mm; border: 1.4mm solid #004d5d; border-radius: 5mm; overflow: hidden; text-align: center; flex-shrink: 0; }
  .qrbox .lbl { background: #004d5d; color: #fff; font-weight: 600; font-size: 17pt; letter-spacing: 2px; padding: 2mm 0 2.6mm; }
  .qrbox img { width: 52mm; height: 52mm; margin: 6mm auto 6mm; display: block; }
  .qrbox .url { font-size: 7.5pt; color: #5f7a80; padding-bottom: 4mm; }
  .foot { background: #004d5d; color: #ffedd9; padding: 6mm 16mm; display: flex; justify-content: space-between; font-size: 10pt; letter-spacing: .6px; }
</style></head>
<body><div class="page">
  <div class="top">
    <img src="../assets/logo.jpg" alt="Rama Beach Resort and Villas">
    <div class="badge">WTM LONDON 2026</div>
  </div>
  <div class="photo"></div>
  <div class="main">
    <div class="text">
      <h1>Travel Agents,<br>Scan to Explore<br>&amp; Register</h1>
      <div class="bar"></div>
      <ul>
        <li>Fact sheet &amp; resort videos</li>
        <li>Restaurant, spa &amp; facilities</li>
        <li>Sales &amp; marketing contacts</li>
        <li>Register your details with us</li>
      </ul>
    </div>
    <div class="qrbox">
      <div class="lbl">SCAN HERE</div>
      <img src="qr-code.png" alt="QR code">
    </div>
  </div>
  <div class="foot">
    <span>www.ramabeachhotel.com</span>
    <span>Jl. Wana Segara No. 31, Tuban, Kuta, Bali</span>
    <span>+62 852 3837 7785</span>
  </div>
</div></body></html>
