<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100vw; height: 100vh; overflow: hidden; }
  body { font-family: "Jost", sans-serif; background: #ffedd9; position: relative; }
  /* soft wave accents */
  .wave { position: absolute; left: -10vw; right: -10vw; border-radius: 50%; }
  .w1 { height: 60vh; bottom: -46vh; background: #7bbdaf; opacity: .22; }
  .w2 { height: 50vh; bottom: -42vh; left: 20vw; right: -30vw; background: #7bbdaf; opacity: .25; }
  .logo { position: absolute; top: 46%; left: 40%; transform: translate(-50%, -62%); width: 28vw; }
  .tag { position: absolute; top: 46%; left: 40%; transform: translate(-50%, 9vh); text-align: center; color: #004d5d; font-size: 1vw; letter-spacing: .32vw; font-weight: 500; }
  .qr { position: absolute; right: 3.5vw; bottom: 11vh; width: 20vw; background: #fff; border: .45vw solid #004d5d; border-radius: 1.4vw; overflow: hidden; text-align: center; box-shadow: 0 1vw 3vw rgba(0,77,93,.12); }
  .qr .lbl { background: #004d5d; color: #fff; font-weight: 600; font-size: 1.7vw; letter-spacing: .3vw; padding: .7vw 0 .9vw; }
  .qr img { width: 16vw; height: 16vw; margin: 1.6vw auto 1vw; display: block; }
  .qr .sub { font-size: 1.15vw; color: #004d5d; padding-bottom: 1.3vw; line-height: 1.3; }
</style></head>
<body>
  <div class="wave w1"></div><div class="wave w2"></div>
  <img class="logo" src="../assets/logo.jpg" alt="">
  <div class="tag">WTM LONDON 2026</div>
  <div class="qr">
    <div class="lbl">SCAN HERE</div>
    <img src="qr-code.png" alt="">
    <div class="sub">Explore &amp; register</div>
  </div>
</body></html>
