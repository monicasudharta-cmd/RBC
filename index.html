<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rama Beach Resort and Villas – WTM London 2026</title>
  <meta name="description" content="View Rama Beach Resort and Villas information online and register your details with us at WTM London 2026." />
  <meta name="theme-color" content="#004d5d" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      /* Rama Beach brand colours (from logo) */
      --teal:   #004d5d;  /* wordmark */
      --sea:    #7bbdaf;  /* wave */
      --sun:    #ec9e4b;  /* sun */
      --cream:  #ffedd9;  /* background */

      --bg: #fdf6ee;
      --card: #ffffff;
      --text: #1d3a42;
      --muted: #5f7a80;
      --border: #f0dfcb;
      --error: #b42318;
      --success: #00695c;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Jost", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    header {
      background: var(--cream);
      text-align: center;
      padding: 28px 20px 72px;
    }
    header img { width: 100%; max-width: 340px; height: auto; display: block; margin: 0 auto 8px; }
    header .event {
      display: inline-block;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      background: var(--teal);
      color: var(--cream);
      padding: 5px 14px;
      border-radius: 999px;
      margin-bottom: 14px;
    }
    header p { color: var(--teal); max-width: 480px; margin: 0 auto; font-size: 15px; }
    main { max-width: 640px; margin: -44px auto 40px; padding: 0 16px; }
    .card {
      background: var(--card);
      border-radius: 16px;
      box-shadow: 0 6px 24px rgba(0, 77, 93, .08);
      padding: 26px 22px;
      margin-bottom: 18px;
    }
    .card h2 {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 28px;
      font-weight: 600;
      color: var(--teal);
      line-height: 1.15;
      margin-bottom: 4px;
    }
    .card h2::after {
      content: "";
      display: block;
      width: 36px; height: 3px;
      background: var(--sun);
      border-radius: 2px;
      margin-top: 8px;
    }
    .card .sub { color: var(--muted); font-size: 14px; margin: 8px 0 18px; }
    .list { display: grid; gap: 10px; }

    .item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 16px;
      border: 1px solid var(--border);
      border-radius: 12px;
      text-decoration: none;
      color: var(--text);
      transition: border-color .15s, background .15s;
    }
    a.item:hover { border-color: var(--sea); background: #f6fbfa; }
    .item .icon {
      flex: 0 0 42px; height: 42px;
      border-radius: 50%;
      background: var(--cream);
      display: flex; align-items: center; justify-content: center;
      font-size: 19px;
    }
    .item .body { flex: 1; min-width: 0; }
    .item strong { display: block; font-size: 16px; font-weight: 600; color: var(--teal); }
    .item span.desc { font-size: 13px; color: var(--muted); }
    .item .arrow { color: var(--sun); font-size: 20px; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
    .chip {
      font-size: 13px;
      font-weight: 500;
      padding: 6px 14px;
      border-radius: 999px;
      background: var(--teal);
      color: #fff;
      text-decoration: none;
    }
    .chip:hover { background: #00687d; }

    form { display: grid; gap: 16px; }
    label { font-size: 14px; font-weight: 600; display: block; margin-bottom: 6px; color: var(--teal); }
    label .req { color: var(--sun); }
    label .opt { color: var(--muted); font-weight: 400; }
    input {
      width: 100%;
      padding: 12px 14px;
      font-size: 16px;
      font-family: inherit;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #fff;
      color: var(--text);
    }
    input:focus { outline: none; border-color: var(--sea); box-shadow: 0 0 0 3px rgba(123, 189, 175, .3); }
    .hint { font-size: 12px; color: var(--muted); margin-top: 4px; }
    button {
      padding: 14px;
      font-size: 16px;
      font-weight: 600;
      font-family: inherit;
      letter-spacing: .5px;
      border: none;
      border-radius: 10px;
      background: var(--teal);
      color: #fff;
      cursor: pointer;
    }
    button:hover { background: #00687d; }
    button:disabled { opacity: .6; cursor: not-allowed; }
    .msg { padding: 14px; border-radius: 10px; font-size: 14px; display: none; }
    .msg.ok { display: block; background: #e8f5f1; color: var(--success); }
    .msg.err { display: block; background: #fef3f2; color: var(--error); }
    footer { text-align: center; font-size: 13px; color: var(--muted); padding-bottom: 32px; }
  </style>
</head>
<body>

  <header>
    <img src="assets/logo.jpg" alt="Rama Beach Resort and Villas" width="900" height="509" />
    <div class="event">WTM London 2026</div>
    <p>Thank you for visiting us. Explore our resort below and leave your details so we can stay in touch.</p>
  </header>

  <main>
    <div id="sections"></div>

    <section class="card">
      <h2>Agent Registration</h2>
      <p class="sub">Leave your details and our team will get in touch.</p>

      <form id="agentForm" novalidate>
        <div>
          <label for="name">Name <span class="req">*</span></label>
          <input id="name" name="name" type="text" autocomplete="name" required />
        </div>
        <div>
          <label for="position">Position <span class="req">*</span></label>
          <input id="position" name="position" type="text" autocomplete="organization-title" required />
        </div>
        <div>
          <label for="company">Company Name <span class="req">*</span></label>
          <input id="company" name="company" type="text" autocomplete="organization" required />
        </div>
        <div>
          <label for="email">Email <span class="req">*</span></label>
          <input id="email" name="email" type="email" autocomplete="email" required />
        </div>
        <div>
          <label for="whatsapp">WhatsApp Number <span class="opt">(optional)</span></label>
          <input id="whatsapp" name="whatsapp" type="tel" autocomplete="tel" placeholder="+44 7700 900123" />
          <div class="hint">Include country code, e.g. +44, +62.</div>
        </div>

        <!-- Honeypot: hidden from humans, catches simple spam bots -->
        <input type="text" name="website" tabindex="-1" autocomplete="off" style="position:absolute;left:-9999px" aria-hidden="true" />

        <div id="formMsg" class="msg" role="status"></div>
        <button type="submit" id="submitBtn">Submit</button>
      </form>
    </section>
  </main>

  <footer>&copy; <span id="year"></span> Rama Beach Resort and Villas · WTM London</footer>

  <script>
    // ================== EDIT THESE ==================
    // Google Drive links: set sharing to "Anyone with the link – Viewer".
    // An item has either `url` (whole row is a link) or `links` (row with buttons).
    // Leave a url as "" to hide that button until the link is ready.
    const SECTIONS = [
      {
        title: "About the Resort",
        items: [
          { icon: "🌐", title: "Resort's Website", desc: "www.ramabeachhotel.com", url: "https://www.ramabeachhotel.com" },
          { icon: "📄", title: "Fact Sheet", desc: "Resort overview", url: "https://drive.google.com/file/d/1UX3pMggYdjrSZwq8f7Mxym6KviA768UH/view" },
          { icon: "🛏️", title: "Room Type", desc: "Rooms & villas", url: "https://drive.google.com/drive/folders/1-Fs4QHg939CxLkrSmVh9QctUEI56TK8S" }
        ]
      },
      {
        title: "Video",
        items: [
          { icon: "▶️", title: "30 Seconds", desc: "Short highlight", url: "https://drive.google.com/file/d/1qQ9brHTseXqcGefyQ2FruMKJgQ2ct0aV/view" },
          { icon: "▶️", title: "2 Minutes",  desc: "Full resort video", url: "" }
        ]
      },
      {
        title: "Facilities",
        items: [
          { icon: "🍽️", title: "Dewi Shinta Restaurant", links: [
              { label: "Photos", url: "https://drive.google.com/drive/folders/1eO3j9iAiE7RFzoASnENYZXSc9vUDTa9a" },
              { label: "Menu",   url: "https://drive.google.com/file/d/1i0lSYF2n9cgfiWhr6vT7esCdqaahlzkA/view" }
          ]},
          { icon: "🌿", title: "Spa", links: [
              { label: "Photos",          url: "https://drive.google.com/drive/folders/1xu7r3AK874c98CYzgi2HUXcBcwXFtWw7" },
              { label: "Menu",            url: "https://drive.google.com/file/d/1q0rR0PPYxn9U0lsgAF_DOH46DAErE_el/view" },
              { label: "Promotion Flyer", url: "https://drive.google.com/file/d/1sD1gJ2WAK-Ejz8k5HFJwZ7uCIdcYiwHz/view" }
          ]},
          { icon: "🏛️", title: "Meeting Room, Gym & Tennis Court", desc: "Photos", url: "https://drive.google.com/drive/folders/1zGguzxVWizkY9fZGFZJLA8HSgHiwrVJS" }
        ]
      },
      {
        title: "Our Team",
        items: [
          { icon: "👤", title: "Yuni",   desc: "Sales · Business card",     url: "https://drive.google.com/file/d/1U7ToA-mbSqOpRmxRma4vg1PqRxnM6Q5w/view" },
          { icon: "👤", title: "Monica", desc: "Marketing · Business card", url: "https://drive.google.com/file/d/1VGUU9sSzygD80vsgDoI8k14W2eEkvEtM/view" }
        ]
      }
    ];

    // Web app URL from Google Apps Script deployment (see README.md)
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyu6GsnT3Vll_ydjM32cYr0-MpQmaLk-NMxtig0NdKqQ019q8oPB3NZ9aQ13ovZjwkfeh/exec";
    // ================================================

    document.getElementById("year").textContent = new Date().getFullYear();

    function el(tag, cls, text) {
      const e = document.createElement(tag);
      if (cls) e.className = cls;
      if (text) e.textContent = text;
      return e;
    }
    function ext(a, url) { a.href = url; a.target = "_blank"; a.rel = "noopener"; return a; }

    const root = document.getElementById("sections");
    for (const sec of SECTIONS) {
      // hide anything without a link yet
      const items = sec.items
        .map(it => it.links ? { ...it, links: it.links.filter(l => l.url) } : it)
        .filter(it => it.links ? it.links.length : it.url);
      if (!items.length) continue;
      const s = { ...sec, items };
      const card = el("section", "card");
      card.appendChild(el("h2", null, s.title));
      card.appendChild(el("p", "sub", "Tap to view online."));
      const list = el("div", "list");
      for (const it of s.items) {
        const row = it.url ? ext(el("a", "item"), it.url) : el("div", "item");
        row.appendChild(el("div", "icon", it.icon));
        const body = el("div", "body");
        body.appendChild(el("strong", null, it.title));
        if (it.desc) body.appendChild(el("span", "desc", it.desc));
        if (it.links) {
          const chips = el("div", "chips");
          for (const l of it.links) chips.appendChild(ext(el("a", "chip", l.label), l.url));
          body.appendChild(chips);
        }
        row.appendChild(body);
        if (it.url) row.appendChild(el("div", "arrow", "→"));
        list.appendChild(row);
      }
      card.appendChild(list);
      root.appendChild(card);
    }

    const form = document.getElementById("agentForm");
    const msg = document.getElementById("formMsg");
    const btn = document.getElementById("submitBtn");

    function show(type, text) {
      msg.className = "msg " + type;
      msg.textContent = text;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      msg.className = "msg";

      const data = Object.fromEntries(new FormData(form).entries());
      for (const k in data) data[k] = data[k].trim();

      if (data.website) return; // bot

      if (!data.name || !data.position || !data.company || !data.email) {
        return show("err", "Please fill in all required fields.");
      }
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(data.email)) {
        return show("err", "Please enter a valid email address.");
      }
      if (data.whatsapp && !/^\+?[\d\s\-()]{7,20}$/.test(data.whatsapp)) {
        return show("err", "Please enter a valid WhatsApp number with country code.");
      }

      btn.disabled = true;
      btn.textContent = "Submitting…";

      try {
        // no-cors: Apps Script doesn't return CORS headers; the request still lands.
        await fetch(SCRIPT_URL, {
          method: "POST",
          mode: "no-cors",
          body: new URLSearchParams(data)
        });
        form.reset();
        show("ok", "Thank you! Your details have been received. We'll be in touch soon.");
      } catch (err) {
        show("err", "Something went wrong. Please check your connection and try again.");
      } finally {
        btn.disabled = false;
        btn.textContent = "Submit";
      }
    });
  </script>
</body>
</html>
